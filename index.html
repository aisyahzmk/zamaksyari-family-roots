<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zamaksyari Family Heritage Tree</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HEADER / NAV -->
  <header id="app-header">
    <div class="brand">
      <span class="brand-icon">&#127795;</span>
      <span>Zamaksyari Family</span>
    </div>

    <nav id="main-nav">
      <button class="nav-btn active" data-view="tree">
        <span>&#127795;</span> <span>Family Tree</span>
      </button>
      <button class="nav-btn" data-view="profile">
        <span>&#128100;</span> <span>Profile</span>
      </button>
      <button class="nav-btn" data-view="stats">
        <span>&#128202;</span> <span>Statistics</span>
      </button>
    </nav>
  </header>

  <!-- MAIN LAYOUT -->
  <main id="app-main">

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h3>Family Members</h3>
        <input id="search-input" type="text" placeholder="Search name, job&hellip;" />
        <div class="filter-row">
          <button class="filter-chip" data-gender="male">&#9794; Male</button>
          <button class="filter-chip" data-gender="female">&#9792; Female</button>
        </div>
      </div>
      <div id="member-list">
        <!-- Populated by FamilyView -->
      </div>
    </aside>

    <!-- Content Area -->
    <section id="content-area">

      <!-- View: Tree -->
      <div id="view-tree" class="view active">
        <div class="empty-state">
          <div class="empty-icon">&#9203;</div>
          <p>Loading family data&hellip;</p>
        </div>
      </div>

      <!-- View: Profile -->
      <div id="view-profile" class="view">
        <div class="empty-state">
          <div class="empty-icon">&#128100;</div>
          <p>Select a family member to view their profile</p>
        </div>
      </div>

      <!-- View: Statistics -->
      <div id="view-stats" class="view">
        <div class="empty-state">
          <div class="empty-icon">&#128202;</div>
          <p>Loading statistics&hellip;</p>
        </div>
      </div>

    </section>
  </main>

  <!-- MODAL -->
  <div id="modal-overlay">
    <div id="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Details</h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <!-- SCRIPTS — MVC layers loaded in order -->
  <script src="js/model/FamilyModel.js"></script>
  <script src="js/view/FamilyView.js"></script>
  <script src="js/controller/FamilyController.js"></script>
  <script>
    // Bootstrap the application
    document.addEventListener('DOMContentLoaded', () => {
      const model      = new FamilyModel();
      const view       = new FamilyView();
      const controller = new FamilyController(model, view);
      controller.init();
    });
  </script>

</body>
</html>
